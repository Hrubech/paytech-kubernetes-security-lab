apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: database
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: paytech
            - name: POSTGRES_USER
              value: paytech_admin
            - name: POSTGRES_PASSWORD
              value: demo-password-not-for-production
          # Secret et contrôles de sécurité volontairement absents
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: database
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Secret
metadata:
  name: database-secret
  namespace: database
type: Opaque
stringData:
  DB_USER: paytech_admin
  DB_PASSWORD: demo-password-not-for-production
